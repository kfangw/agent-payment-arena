[project]
name = "agent-payment-arena"
version = "0.0.1"
description = "An evaluation environment that measures what breaks when LLM agents are given the authority to spend money."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Hwangwook Kim" }]
keywords = ["x402", "agent", "payments", "evaluation", "mcp", "prompt-injection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "pydantic>=2.9",
    "eth-account>=0.13",
    "numpy>=2.5.2",
]

[project.optional-dependencies]
# The arena runs end to end without any of these. Each extra unlocks one
# optional backend or actor; the default path stays dependency-light so that
# `uv sync && uv run arena demo` works with no keys and no network.
http = ["httpx>=0.27"]
mcp = ["mcp>=1.2"]
llm = ["langgraph>=0.2", "anthropic>=0.40", "openai>=1.50"]

[project.scripts]
arena = "arena.cli:main"

[project.urls]
Repository = "https://github.com/kfangw/agent-payment-arena"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arena"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# The settlement experiment uses mathematical notation and lightweight
# research scripts. Keep the reusable arena package and its tests on the strict
# lint profile; the experiment code remains covered by regression and
# validation tests.
extend-exclude = ["src/arena/experiments/settlement", "scripts/run_*.py", "scripts/analyze_r2.py"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific
    "ANN",  # flake8-annotations
    "D",    # pydocstyle
]
ignore = [
    "D107",  # __init__ docstrings live on the class
    "D203",  # incompatible with D211
    "D213",  # incompatible with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103"]
"tests/test_structcheck.py" = ["ANN", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_explicit = true
enable_error_code = ["redundant-expr", "possibly-undefined", "truthy-bool"]
files = ["src", "tests"]
exclude = ["tests/test_structcheck.py", "src/arena/experiments/settlement"]

[[tool.mypy.overrides]]
module = ["eth_account.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["arena.gateway.schemas"]
# Pydantic's BaseModel is typed through an Any-valued metaclass in its stubs.
disable_error_code = ["explicit-any"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    # Tests that call a live LLM provider. Excluded from CI, which replays
    # cassettes instead. Run them locally with `pytest -m live --record`.
    "live: requires a live LLM provider and network access",
    # Tests that require a running stablecoin-x402-gateway over HTTP.
    "http_gateway: requires a running gateway on HTTP",
]

[tool.coverage.run]
branch = true
source = ["src/arena"]
omit = ["src/arena/experiments/settlement/*"]

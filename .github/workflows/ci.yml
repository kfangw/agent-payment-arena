# CI: lint, strict type check and the full test suite on every push and PR.
#
# No job here calls an LLM provider. Tests that need one are marked `live` and
# are excluded; the recorded cassettes are what CI replays, so a run costs
# nothing and is deterministic.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fail loudly rather than silently reaching a provider if a test is
  # mismarked.
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --all-extras --dev

      - name: ruff format
        run: uv run ruff format --check .

      - name: ruff lint
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy

      - name: English only
        run: uv run python scripts/check_english_only.py

      - name: pytest
        run: uv run pytest -m "not live and not http_gateway" --cov --cov-report=term-missing

  # The demo is the first thing a reader runs, so it is checked like a test:
  # a clean install must reach a working command with no keys and no network
  # services.
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install without extras
        run: uv sync

      - name: Run the CLI
        run: |
          uv run arena --version
          uv run arena contract
          uv run arena demo

  http-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: kfangw/stablecoin-x402-gateway
          ref: ddd20fe3ec7c2109a006e1112bcac9fdeabf9b32
          path: stablecoin-x402-gateway

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install HTTP backend
        run: uv sync --extra http --dev

      - name: Start reference gateway stack
        run: docker compose -f stablecoin-x402-gateway/docker-compose.yml up --build -d

      - name: Wait for gateway
        run: |
          for attempt in $(seq 1 60); do
            curl --fail --silent http://localhost:8402/healthz && exit 0
            sleep 2
          done
          docker compose -f stablecoin-x402-gateway/docker-compose.yml logs
          exit 1

      - name: Register reference agent
        run: |
          docker compose -f stablecoin-x402-gateway/docker-compose.yml \
            --profile demo run --rm agent

      - name: Differential contract test
        env:
          ARENA_HTTP_GATEWAY_URL: http://localhost:8402
        run: uv run pytest -m http_gateway tests/test_gateway_differential.py

      - name: Show logs on failure
        if: failure()
        run: docker compose -f stablecoin-x402-gateway/docker-compose.yml logs

      - name: Stop reference gateway stack
        if: always()
        run: docker compose -f stablecoin-x402-gateway/docker-compose.yml down --volumes
